# megavibe dispatch: GitHub issues in, code changes and pull requests out.
#   cp docker/.env.example docker/.env   (fill it in)
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build
#   docker compose -f docker/docker-compose.yml exec -it megavibe tmux attach -t mvd-<repo-name>   (detach: Ctrl-b d)
services:
  megavibe:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: megavibe-dispatch
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    tty: true
    stdin_open: true
    environment:
      GH_TOKEN: ${GH_TOKEN:?a fine-grained token for the ONE repository (Issues, Contents, Pull requests: read and write)}
      GH_HOST: ${GH_HOST:-github.com}
      MEGAVIBE_REPO: ${MEGAVIBE_REPO:?OWNER/NAME of the repository}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-megavibe}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-megavibe-dispatch@localhost.invalid}
      MEGAVIBE_MAX: ${MEGAVIBE_MAX:-3}
      MEGAVIBE_TOTAL: ${MEGAVIBE_TOTAL:-}
      MEGAVIBE_ISSUES: ${MEGAVIBE_ISSUES:-}
      MEGAVIBE_LABELS: ${MEGAVIBE_LABELS:-}
      MEGAVIBE_LABEL_LIMIT: ${MEGAVIBE_LABEL_LIMIT:-}
      MEGAVIBE_BASE: ${MEGAVIBE_BASE:-}
      MEGAVIBE_MODEL: ${MEGAVIBE_MODEL:-}
      MEGAVIBE_TICKET_SKILL: ${MEGAVIBE_TICKET_SKILL:-}
      MEGAVIBE_PRECHECK: ${MEGAVIBE_PRECHECK:-on}
      MEGAVIBE_ALLOW_PUBLIC: ${MEGAVIBE_ALLOW_PUBLIC:-0}
      MEGAVIBE_TICK_SECS: ${MEGAVIBE_TICK_SECS:-120}
    volumes:
      - work:/work
      - megavibe-home:/home/mv/.megavibe
      - claude-home:/home/mv/.claude
volumes:
  work:
  megavibe-home:
  claude-home:
